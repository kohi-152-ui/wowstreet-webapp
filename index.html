<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>WOWSTREET Arena</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0F1A;
    --surface:#131A2B;
    --surface-2:#182238;
    --border:#232C42;
    --text:#EDF1FA;
    --text-dim:#7C87A8;
    --long:#34D399;
    --short:#FB7185;
    --warn:#FBBF24;
    --brand:#6366F1;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; min-height:100%; height:100%; background:var(--bg); color:var(--text);
    font-family:'Manrope',sans-serif; overflow:hidden;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .mono{ font-family:'JetBrains Mono', monospace; }

  #app{ display:flex; flex-direction:column; min-height:100%; height:100vh; height:100dvh; padding-bottom: env(safe-area-inset-bottom, 12px); }

  /* ---------- Header ---------- */
  header{
    padding:14px 16px 10px; flex-shrink:0;
    border-bottom:1px solid var(--border);
    background:linear-gradient(180deg, var(--surface) 0%, var(--bg) 100%);
  }
  .brand{
    display:flex; align-items:center; gap:6px;
    font-size:11px; font-weight:700; letter-spacing:.12em;
    color:var(--text-dim); text-transform:uppercase; margin-bottom:8px;
  }
  .brand b{ color:var(--brand); }
  .ticker-row{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .pulse-dot{
    width:9px; height:9px; border-radius:50%; background:var(--long);
    box-shadow:0 0 0 0 rgba(52,211,153,.6);
    flex-shrink:0; margin-right:2px; align-self:center;
  }
  .pulse-dot.down{ background:var(--short); box-shadow:0 0 0 0 rgba(251,113,133,.6); }
  .pulse-dot.pulse{ animation:pulse .6s ease-out; }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(52,211,153,.55); }
    70%{ box-shadow:0 0 0 10px rgba(52,211,153,0); }
    100%{ box-shadow:0 0 0 0 rgba(52,211,153,0); }
  }
  .pulse-dot.down.pulse{ animation-name:pulseDown; }
  @keyframes pulseDown{
    0%{ box-shadow:0 0 0 0 rgba(251,113,133,.55); }
    70%{ box-shadow:0 0 0 10px rgba(251,113,133,0); }
    100%{ box-shadow:0 0 0 0 rgba(251,113,133,0); }
  }
  #price{ font-size:28px; font-weight:700; letter-spacing:-.01em; }
  #price.tick-up{ color:var(--long); }
  #price.tick-down{ color:var(--short); }
  #change-chip{
    font-size:13px; font-weight:700; padding:3px 9px; border-radius:999px;
    background:var(--surface-2); border:1px solid var(--border);
  }
  #change-chip.up{ color:var(--long); border-color:rgba(52,211,153,.35); }
  #change-chip.down{ color:var(--short); border-color:rgba(251,113,133,.35); }
  #symbol-label{ font-size:12px; color:var(--text-dim); font-weight:500; }

  /* ---------- Chart ---------- */
  #chart-wrap{ position:relative; flex:1; min-height:0; }
  #chart{ position:absolute; inset:0; }
  #chart-status{
    position:absolute; top:10px; left:50%; transform:translateX(-50%);
    font-size:12px; color:var(--text-dim); background:rgba(19,26,43,.85);
    padding:6px 12px; border-radius:8px; border:1px solid var(--border);
    z-index: 10;
  }

  /* ---------- Position card ---------- */
  #position-card{
    display:none; flex-shrink:0; margin:0 12px 12px; padding:14px 16px;
    border-radius:16px; background:rgba(19,26,43,.9); backdrop-filter:blur(10px);
    border:1px solid var(--border);
  }
  #position-card.long{ border-color:rgba(52,211,153,.4); }
  #position-card.short{ border-color:rgba(251,113,133,.4); }
  .pc-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .side-badge{
    font-size:12px; font-weight:800; padding:4px 10px; border-radius:8px; letter-spacing:.03em;
  }
  .side-badge.long{ background:rgba(52,211,153,.15); color:var(--long); }
  .side-badge.short{ background:rgba(251,113,133,.15); color:var(--short); }
  .pc-lev{ font-size:12px; color:var(--text-dim); }
  .pc-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px; }
  .pc-field .label{ font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.08em; margin-bottom:2px; }
  .pc-field .value{ font-size:14px; font-weight:600; }
  #pnl-usd.pos, #pnl-pct.pos{ color:var(--long); }
  #pnl-usd.neg, #pnl-pct.neg{ color:var(--short); }
  
  #close-btn{
    width:100%; padding:12px; border:none; border-radius:12px; font-size:14px; font-weight:800;
    background:var(--short); color:#1a0a0d; cursor:pointer; letter-spacing:.02em;
    transition: opacity 0.2s;
  }
  #close-btn:active{ opacity:.8; }
  #close-btn:disabled { background: #555; color: #999; cursor: not-allowed; }
  #close-hint{ font-size:11px; color:var(--text-dim); text-align:center; margin-top:8px; }

  /* ---------- Action Bar (NEW) ---------- */
  #action-bar {
    display: block; /* Mặc định hiển thị, sẽ được điều khiển bởi JS */
    flex-shrink: 0; padding: 12px 16px; border-top: 1px solid var(--border);
    background: var(--surface);
    touch-action: manipulation;
  }
  .input-row { display: flex; gap: 10px; margin-bottom: 12px; }
  .input-group { flex: 1; display: flex; align-items: center; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 0 8px; }
  .input-group label { font-size: 11px; color: var(--text-dim); font-weight: 700; width: 45px; }
  .input-group input { 
    flex: 1; background: transparent; border: none; color: var(--text); 
    padding: 10px 4px; font-weight: 700; text-align: right; font-family: 'JetBrains Mono', monospace; outline: none;
  }
  
  .btn-row { display: flex; gap: 10px; margin-bottom: 10px; }
  .btn-action {
    flex: 1; padding: 14px 12px; border: none; border-radius: 10px; font-size: 14px; font-weight: 800; 
    cursor: pointer; color: #1a0a0d; transition: opacity 0.2s, transform 0.15s;
    touch-action: manipulation;
  }
  .btn-action:active {
    opacity: 0.85; transform: scale(0.98);
  }
  .btn-action:disabled { opacity: 0.5; cursor: not-allowed; }
  
  .btn-long { background: var(--long); }
  .btn-short { background: var(--short); }
  .btn-hedge { background: #60A5FA; } /* Màu xanh lam */
  .btn-reverse { background: #FBBF24; } /* Màu vàng */
  
  #action-hint { font-size: 12px; color: var(--text-dim); text-align: center; margin-top: 4px; font-weight: 500; height: 16px; }

  footer{
    flex-shrink:0; text-align:center; font-size:10px; color:var(--text-dim);
    padding:6px 0 10px; background: var(--surface); letter-spacing:.04em;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand" id="brand-header">🏛 WOWSTREET <b>ARENA</b></div>
    <div class="ticker-row">
      <span class="pulse-dot" id="pulseDot"></span>
      <span id="price" class="mono">--</span>
      <span id="change-chip" class="mono">0.00%</span>
    </div>
    <div id="symbol-label">Đang tải dữ liệu...</div>
  </header>

  <div id="chart-wrap">
    <div id="chart"></div>
    <div id="chart-status">Đang kết nối hệ thống...</div>
  </div>

  <div id="position-card">
    <div class="pc-top">
      <span id="pc-side" class="side-badge">LONG</span>
      <span id="pc-lev" class="pc-lev mono">x1</span>
    </div>
    <div class="pc-grid">
      <div class="pc-field">
        <div class="label">Giá vào</div>
        <div class="value mono" id="pc-entry">--</div>
      </div>
      <div class="pc-field">
        <div class="label">Ký quỹ</div>
        <div class="value mono" id="pc-margin">--</div>
      </div>
      <div class="pc-field">
        <div class="label">PnL</div>
        <div class="value mono" id="pnl-usd">--</div>
      </div>
      <div class="pc-field">
        <div class="label">PnL %</div>
        <div class="value mono" id="pnl-pct">--</div>
      </div>
    </div>
    <button id="close-btn">🔻 ĐÓNG VỊ THẾ</button>
    <div id="close-hint"></div>
  </div>

  <!-- THANH CÔNG CỤ TƯƠNG TÁC (Chỉ hiện khi ở Arena Mode) -->
  <div id="action-bar">
    <div class="input-row">
      <div class="input-group">
        <label>SIZE%</label>
        <input type="number" id="input-size" value="20" min="1" max="100">
      </div>
      <div class="input-group">
        <label>LEV x</label>
        <input type="number" id="input-lev" value="1" min="1" max="100">
      </div>
    </div>
    <div class="btn-row">
      <button id="btn-long" class="btn-action btn-long">🟢 LONG</button>
      <button id="btn-short" class="btn-action btn-short">🔴 SHORT</button>
    </div>
    <div class="btn-row">
      <button id="btn-hedge" class="btn-action btn-hedge">🛡 HEDGE</button>
      <button id="btn-reverse" class="btn-action btn-reverse">🔄 REVERSE</button>
    </div>
    <div id="action-hint">Sẵn sàng giao dịch.</div>
  </div>

  <footer>Mô phỏng học tập · không dùng tiền thật</footer>
</div>

<script>
(function(){
  // ---------- Telegram WebApp setup ----------
  var tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
  if(tg){ tg.ready(); tg.expand(); }

  // ---------- API Gọi Backend tự thiết kế ----------
  async function apiCall(endpoint, method = 'GET', body = null) {
    // Sử dụng URL tương đối - sẽ tự động trỏ đến cùng domain với file HTML
    const url = endpoint.startsWith('http') ? endpoint : endpoint;
    
    const options = {
      method: method,
      headers: {
        'Content-Type': 'application/json'
      }
    };
    
    // Chỉ thêm header Telegram nếu có initData (trong Telegram App)
    if (tg && tg.initData) {
      options.headers['X-Telegram-Init-Data'] = tg.initData;
    } else {
      console.warn("Không có Telegram initData - đang dùng debug mode");
      // For local testing, add debug header
      options.headers['X-Telegram-Init-Data'] = 'debug-mode';
    }
    
    if (body) {
      options.body = JSON.stringify(body);
    }
    
    try {
      const response = await fetch(url, options);
      
      // Check if response is OK
      if (!response.ok) {
        const text = await response.text();
        console.error(`HTTP error! status: ${response.status}`, text);
        throw new Error(`HTTP error! status: ${response.status}`);
      }
      
      // Check content type to ensure it's JSON
      const contentType = response.headers.get("content-type");
      if (!contentType || !contentType.includes("application/json")) {
        const text = await response.text();
        console.error("Response không phải JSON:", text);
        throw new Error("Server trả về không phải JSON. Response: " + text.substring(0, 200));
      }
      
      return await response.json();
    } catch (error) {
      console.error("API Call error:", error);
      throw error;
    }
  }

  // ---------- Format số động ----------
  function fmtUsd(x){
    let fraction = x < 0.1 ? 6 : (x < 10 ? 4 : 2);
    return '$' + x.toLocaleString('en-US', {minimumFractionDigits:fraction, maximumFractionDigits:fraction});
  }
  function fmtSignedUsd(x){
    let fraction = 2;
    return (x>=0?'+':'-') + '$' + Math.abs(x).toLocaleString('en-US', {minimumFractionDigits:fraction, maximumFractionDigits:fraction});
  }
  function fmtSignedPct(x){
    return (x>=0?'+':'') + x.toFixed(2) + '%';
  }

  // ---------- Position params from URL ----------
  var qs = new URLSearchParams(window.location.search);
  var position = null;
  if(qs.has('side') && qs.has('entry')){
    position = {
      side: qs.get('side'),
      entry: parseFloat(qs.get('entry')),
      lev: parseInt(qs.get('lev') || '1', 10),
      margin: parseFloat(qs.get('margin') || '0')
    };
  }

  // ---------- Sync state from API ----------
  async function syncState() {
    try {
      const state = await apiCall('/api/state', 'GET');
      if (state.ok && state.in_room) {
        // Hiển thị action bar khi ở ARENA mode
        if (state.mode === 'ARENA') {
          document.getElementById('action-bar').style.display = 'block';
          document.getElementById('brand-header').innerHTML = '🏛 WOWSTREET <b>ARENA</b>';
          
          // Update position from API state
          if (state.position) {
            position = {
              side: state.position.side,
              entry: state.position.entry_price,
              lev: state.position.leverage,
              margin: state.position.margin
            };
            updatePositionCardUI();
          } else {
            position = null;
            hidePositionCard();
          }
        } else if (state.mode === 'INDEX') {
          // Ẩn action bar khi ở INDEX mode
          document.getElementById('action-bar').style.display = 'none';
          document.getElementById('brand-header').innerHTML = '📈 WOWSTREET <b>INDEX</b>';
        }
      } else {
        // Không có phòng nào, ẩn action bar
        document.getElementById('action-bar').style.display = 'none';
        document.getElementById('brand-header').innerHTML = '🏛 WOWSTREET <b>ARENA</b>';
      }
    } catch (e) {
      console.error("Lỗi đồng bộ trạng thái:", e);
      // Mặc định hiển thị action bar khi có lỗi
      document.getElementById('action-bar').style.display = 'block';
    }
  }

  function updatePositionCardUI() {
    if (!position) {
      hidePositionCard();
      return;
    }

    var card = document.getElementById('position-card');
    card.style.display = 'block';
    card.classList.add(position.side === 'SHORT' ? 'short' : 'long');
    
    var sideBadge = document.getElementById('pc-side');
    sideBadge.textContent = (position.side === 'SHORT' ? '🔴 SHORT' : '🟢 LONG');
    sideBadge.classList.add(position.side === 'SHORT' ? 'short' : 'long');
    
    document.getElementById('pc-lev').textContent = 'x' + position.lev;
    document.getElementById('pc-entry').textContent = fmtUsd(position.entry);
    document.getElementById('pc-margin').textContent = fmtUsd(position.margin);
    
    // Update PnL with current price
    if (lastPrice) {
      updatePositionCard(lastPrice);
    }
  }

  function hidePositionCard() {
    var card = document.getElementById('position-card');
    card.style.display = 'none';
  }

  // ---------- Chart setup ----------
  var chartEl = document.getElementById('chart');
  var chart = LightweightCharts.createChart(chartEl, {
    layout: { background: { color: 'transparent' }, textColor: '#7C87A8', fontFamily: 'JetBrains Mono, monospace', fontSize: 11 },
    grid: { vertLines: { color: 'rgba(35,44,66,0.5)' }, horzLines: { color: 'rgba(35,44,66,0.5)' } },
    rightPriceScale: { borderColor: '#232C42' },
    timeScale: { borderColor: '#232C42', timeVisible: true, secondsVisible: false },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
  });
  var candleSeries = chart.addCandlestickSeries({
    upColor: '#34D399', downColor: '#FB7185',
    borderUpColor: '#34D399', borderDownColor: '#FB7185',
    wickUpColor: '#34D399', wickDownColor: '#FB7185',
  });

  function resizeChart(){
    chart.applyOptions({ width: chartEl.clientWidth, height: chartEl.clientHeight });
  }
  window.addEventListener('resize', resizeChart);
  resizeChart();

  var chartStatus = document.getElementById('chart-status');

  // Vẽ vạch giá Entry
  if(position){
    var lineColor = position.side === 'SHORT' ? '#FB7185' : '#34D399';
    candleSeries.createPriceLine({
      price: position.entry, color: lineColor, lineWidth: 1,
      lineStyle: LightweightCharts.LineStyle.Dashed, axisLabelVisible: true,
      title: 'Entry ' + position.side,
    });
  }

  // ---------- Live price UI Updater ----------
  var priceEl = document.getElementById('price');
  var pulseDot = document.getElementById('pulseDot');
  var changeChip = document.getElementById('change-chip');

  var sessionOpenPrice = null;
  var lastPrice = null;

  function updatePriceUI(price){
    if(sessionOpenPrice === null) sessionOpenPrice = price;
    var up = lastPrice !== null ? price >= lastPrice : true;
    lastPrice = price;

    priceEl.textContent = fmtUsd(price);
    priceEl.className = 'mono ' + (up ? 'tick-up' : 'tick-down');

    pulseDot.className = 'pulse-dot pulse' + (up ? '' : ' down');
    void pulseDot.offsetWidth; 
    pulseDot.classList.add('pulse');

    var changePct = ((price - sessionOpenPrice) / sessionOpenPrice) * 100;
    changeChip.textContent = fmtSignedPct(changePct);
    changeChip.className = 'mono ' + (changePct >= 0 ? 'up' : 'down');

    if(position){ updatePositionCard(price); }
  }

  function updatePositionCard(price){
    var move = (price - position.entry) / position.entry;
    if(position.side === 'SHORT') move = -move;
    var pnlUsd = position.margin * position.lev * move;
    var pnlPct = position.margin ? (pnlUsd / position.margin * 100) : 0;

    document.getElementById('pnl-usd').textContent = fmtSignedUsd(pnlUsd);
    document.getElementById('pnl-pct').textContent = fmtSignedPct(pnlPct);
    document.getElementById('pnl-usd').className = 'value mono ' + (pnlUsd>=0?'pos':'neg');
    document.getElementById('pnl-pct').className = 'value mono ' + (pnlUsd>=0?'pos':'neg');
  }

  async function loadBinanceChart(symbol, enableWs) {
    chartStatus.textContent = '⏳ Đang tải dữ liệu biểu đồ ' + symbol + '...';
    try {
      const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=1m&limit=120`);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const rows = await res.json();
      const data = rows.map(function(k){
        return { time: Math.floor(k[0]/1000), open:+k[1], high:+k[2], low:+k[3], close:+k[4] };
      });
      candleSeries.setData(data);
      if (data.length) updatePriceUI(data[data.length - 1].close);
      chartStatus.style.display = 'none';
    } catch (e) {
      console.error('Không tải được lịch sử Binance:', e);
      chartStatus.textContent = 'Không tải được lịch sử Binance — tiếp tục cập nhật giá live';
      setTimeout(function(){ chartStatus.style.display='none'; }, 3000);
    }

    if (enableWs) {
      connectBinanceWS(symbol);
    }
  }

  function connectBinanceWS(symbol) {
    const symLower = symbol.toLowerCase();
    const wsUrl = `wss://stream.binance.com:9443/stream?streams=${symLower}@trade/${symLower}@kline_1m`;
    const ws = new WebSocket(wsUrl);

    ws.onmessage = function(evt){
      try {
        var msg = JSON.parse(evt.data);
        if (msg && msg.stream && msg.data) {
          var stream = msg.stream;
          var d = msg.data;
          if (stream.indexOf('@trade') !== -1) {
            updatePriceUI(parseFloat(d.p));
          } else if (stream.indexOf('@kline') !== -1) {
            var k = d.k;
            candleSeries.update({
              time: Math.floor(k.t/1000), open:+k.o, high:+k.h, low:+k.l, close:+k.c
            });
          }
        }
      } catch (e) {
        console.error('Lỗi xử lý tin nhắn WebSocket:', e);
      }
    };

    ws.onclose = function(){ setTimeout(function(){ connectBinanceWS(symbol); }, 2000); };
    ws.onerror = function(){ ws.close(); };
  }

  // Gắn UI Position Card & Nút đóng
  var closeBtn = document.getElementById('close-btn');
  var closeHint = document.getElementById('close-hint');

  // Initialize position card from URL params if available
  if(position){
    updatePositionCardUI();
  }

  closeBtn.addEventListener('click', async function(){
    closeBtn.disabled = true;
    closeBtn.textContent = '⏳ ĐANG XỬ LÝ...';
    closeHint.textContent = 'Đang gửi lệnh đóng...';
    
    try {
      const data = await apiCall('/api/close', 'POST');
      if (data.ok) {
        closeHint.textContent = '✅ ' + data.message;
        closeHint.style.color = 'var(--long)';
        closeBtn.textContent = 'ĐÃ CHỐT XONG';
        // Sync state again after closing
        await syncState();
        setTimeout(() => { if(tg) tg.close(); }, 2000);
      } else {
        closeHint.textContent = '⚠️ ' + (data.message || 'Lỗi không xác định');
        closeHint.style.color = 'var(--warn)';
        closeBtn.disabled = false;
        closeBtn.textContent = '🔻 ĐÓNG VỊ THẾ';
      }
    } catch (error) {
      closeHint.textContent = '❌ Lỗi kết nối: ' + error.message;
      closeHint.style.color = 'var(--warn)';
      closeBtn.disabled = false;
      closeBtn.textContent = '🔻 ĐÓNG VỊ THẾ';
    }
  });

  // ==========================================
  // XỬ LÝ SỰ KIỆN CHO THANH CÔNG CỤ ACTION BAR
  // ==========================================
  const actionHint = document.getElementById('action-hint');
  const inputSize = document.getElementById('input-size');
  const inputLev = document.getElementById('input-lev');

  async function executeOrder(endpoint, body, btnEl, originalText) {
    btnEl.disabled = true;
    btnEl.innerText = '⏳...';
    actionHint.textContent = 'Đang gửi lệnh...';
    actionHint.style.color = 'var(--text-dim)';
    
    try {
      const res = await apiCall(endpoint, 'POST', body);
      if (res.ok) {
        actionHint.textContent = '✅ ' + res.message;
        actionHint.style.color = 'var(--long)';
        // Sync state after placing order
        await syncState();
      } else {
        actionHint.textContent = '⚠️ ' + (res.message || 'Lỗi');
        actionHint.style.color = 'var(--warn)';
      }
    } catch (e) {
      actionHint.textContent = '❌ Lỗi kết nối!';
      actionHint.style.color = 'var(--warn)';
    }
    
    btnEl.disabled = false;
    btnEl.innerText = originalText;
    setTimeout(() => { 
        if(actionHint.textContent.includes('✅')) {
            actionHint.textContent = 'Sẵn sàng giao dịch.'; 
            actionHint.style.color = 'var(--text-dim)';
        }
    }, 4000);
  }

  document.getElementById('btn-long').onclick = function() {
    executeOrder('/api/order', {side: 'LONG', size_pct: parseFloat(inputSize.value)||20, leverage: parseFloat(inputLev.value)||1}, this, '🟢 LONG');
  };
  document.getElementById('btn-short').onclick = function() {
    executeOrder('/api/order', {side: 'SHORT', size_pct: parseFloat(inputSize.value)||20, leverage: parseFloat(inputLev.value)||1}, this, '🔴 SHORT');
  };
  document.getElementById('btn-hedge').onclick = function() {
    executeOrder('/api/hedge', null, this, '🛡 HEDGE');
  };
  document.getElementById('btn-reverse').onclick = function() {
    executeOrder('/api/reverse', null, this, '🔄 REVERSE');
  };


  // ==========================================
  // KHỞI CHẠY HỆ THỐNG DỮ LIỆU ĐỘNG (ROUTER)
  // ==========================================
  async function initDataStream() {
    try {
      // Mặc định hiển thị action bar trước khi sync state
      document.getElementById('action-bar').style.display = 'block';
      
      // Test connection to health endpoint first
      console.log("Testing API connection to /api/health...");
      try {
        const healthResponse = await fetch('/api/health', {
          method: 'GET',
          headers: { 'Content-Type': 'application/json' }
        });
        console.log("Health response status:", healthResponse.status);
        
        if (healthResponse.status === 404) {
          console.warn("API server chưa chạy, vẫn hiển thị biểu đồ Binance.");
          chartStatus.textContent = '⚠️ API Server chưa chạy. Hiển thị biểu đồ Binance cục bộ...';
          await loadBinanceChart('BTCUSDT', true);
          return;
        }
        
        if (healthResponse.ok) {
          const healthData = await healthResponse.json();
          console.log("API Health check passed:", healthData);
          chartStatus.textContent = '✅ API Server đã kết nối - Đang tải dữ liệu...';
        } else {
          throw new Error(`Health check failed: ${healthResponse.status}`);
        }
      } catch (healthError) {
        console.warn("API health check failed, chờ vẽ biểu đồ Binance cục bộ:", healthError);
        document.getElementById('action-bar').style.display = 'none';
        chartStatus.textContent = '⚠️ API Server không khả dụng. Hiển thị biểu đồ Binance cục bộ...';
        await loadBinanceChart('BTCUSDT', true);
        return;
      }
      
      // Sync state first to get current position
      try {
        await syncState();
      } catch (syncError) {
        console.warn('Không đồng bộ được trạng thái API, vẫn tiếp tục hiển thị biểu đồ Binance:', syncError);
        document.getElementById('action-bar').style.display = 'none';
      }
      
      let config = null;
      try {
        config = await apiCall('/api/klines', 'GET');
      } catch (klinesError) {
        console.warn('Không lấy được /api/klines, fallback về biểu đồ Binance:', klinesError);
        await loadBinanceChart('BTCUSDT', true);
        return;
      }
      
      if (!config || !config.ok) {
        console.warn('Không có phòng game hoặc /api/klines trả về lỗi, vẽ chart mặc định BTC/USDT.');
        await loadBinanceChart('BTCUSDT', true);
        return;
      }

      if (config.mode === 'INDEX') {
        // --- CHẾ ĐỘ INDEX BATTLE ---
        document.getElementById('brand-header').innerHTML = '📈 WOWSTREET <b>INDEX</b>';
        document.getElementById('symbol-label').textContent = 'Danh mục 5 tài sản · Lấy giá tổng hợp';
        document.getElementById('action-bar').style.display = 'none'; // Ẩn Action Bar khi đua danh mục
        
        if (config.data && config.data.length > 0) {
            candleSeries.setData(config.data);
            updatePriceUI(config.data[config.data.length - 1].close);
        }
        chartStatus.style.display = 'none';

        setInterval(async () => {
            try {
                const refresh = await apiCall('/api/klines', 'GET');
                if (refresh.ok && refresh.data && refresh.data.length > 0) {
                    const lastCandle = refresh.data[refresh.data.length - 1];
                    candleSeries.update(lastCandle);
                    updatePriceUI(lastCandle.close);
                }
            } catch (e) {
                console.error("Lỗi cập nhật Index Chart", e);
            }
        }, 5000);

      } else {
        // --- CHẾ ĐỘ ARENA ĐA TÀI SẢN ---
        const symbol = config.symbol || 'BTCUSDT';
        document.getElementById('symbol-label').textContent = symbol.replace('USDT', '') + '/USDT · realtime via Binance';
        document.getElementById('action-bar').style.display = 'block'; // Hiện Action Bar để trade
        document.getElementById('brand-header').innerHTML = '🏛 WOWSTREET <b>ARENA</b>';
        await loadBinanceChart(symbol, true);
      }
    } catch (error) {
      chartStatus.textContent = 'Lỗi kết nối Server: ' + error.message;
    }
  }

  // Kích nổ 🚀
  initDataStream();

})();
</script>
</body>
</html>
